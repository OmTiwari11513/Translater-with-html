<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: #f4f4f4;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 50%;
            margin: auto;
            transition: background 0.3s, color 0.3s;
        }
        input, button, select {
            margin: 10px 0;
            padding: 10px;
            width: 80%;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
        }
        /* Dark Mode Styles */
        .dark-mode {
            background-color: #222;
            color: white;
        }
        .dark-mode .container {
            background: #333;
            color: white;
        }
        /* Dark Mode Toggle Button */
        .toggle-btn {
            position: center;
            top: 10px;
            right: 5px;
            padding: 8px 10px;
            cursor: pointer;
            border: none;
            background: #444;
            color: white;
            border-radius: 5px;
        }
        .toggle-btn:hover {
            background: #666;
        }
    </style>
</head>
<body>

    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

    <div class="container">
        <h2>Text Translator</h2>
        <label>Enter text to translate:</label>
        <input type="text" id="textInput" placeholder="Type text here...">
        
        <label> <br>Select Target Language:</label>
        
        <select id="langSelect">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh">Chinese</option>
            <option value="hi">Hindi</option>
            <option value="ar">Arabic</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
        </select>
        
        <button onclick="translateText()">Translate</button>

        <p class="result" id="resultText">Translated Text: </p>
    </div>

    <script>
        function translateText() {
            const text = document.getElementById("textInput").value;
            const targetLang = document.getElementById("langSelect").value;

            if (!text || !targetLang) {
                alert("Please enter text and select a target language.");
                return;
            }

            const url = "https://ai-translate.p.rapidapi.com/translate";
            const apiKey = "12e5c28ef1mshd2cd317fad4d42fp1f1937jsn8f8e7e01f9d6"; // Replace with your RapidAPI key

            const data = {
                texts: [text],
                tl: targetLang,
                sl: "auto"
            };

            fetch(url, {
                method: "POST",
                headers: {
                    "x-rapidapi-key": apiKey,
                    "x-rapidapi-host": "ai-translate.p.rapidapi.com",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.texts) {
                    document.getElementById("resultText").innerText = "Translated Text: " + result.texts[0];
                } else {
                    alert("Translation failed. Please check the input.");
                }
            })
            .catch(error => {
                alert("An error occurred: " + error);
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            document.querySelector(".container").classList.toggle("dark-mode");
            const button = document.querySelector(".toggle-btn");
            if (document.body.classList.contains("dark-mode")) {
                button.innerText = "☀️ Light Mode";
            } else {
                button.innerText = "🌙 Dark Mode";
            }
        }
    </script>

</body>
</html>
